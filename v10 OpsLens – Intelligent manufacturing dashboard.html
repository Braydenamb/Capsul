<style>
:root{--page:#E4EAEE;--panel:#F8FAFB;--panel2:#EBF0F3;--ink:#0F2231;--mute:#4C6170;--line:#C7D2D9;--brand:#0A6A8A;--chrome:#0D1E2B;--cink:#E3EDF3;--cmute:#8FA7B5;

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#08121A;--panel:#0F1E29;--panel2:#0B1821;--ink:#E5EEF3;--mute:#93A9B6;--line:#203545;--brand:#3DB6D8;--chrome:#040A10;--N:#4CC38A;--W:#F0B62B;--A:#FF8A4C;--T:#FF6178;--R:#7E9CB4;--f1:#7FC3E0;--f2:#4AA1C2;--f3:#2A7A9C;--f4:#1B506B}}
:root[data-theme=dark]{--page:#08121A;--panel:#0F1E29;--panel2:#0B1821;--ink:#E5EEF3;--mute:#93A9B6;--line:#203545;--brand:#3DB6D8;--chrome:#040A10;--N:#4CC38A;--W:#F0B62B;--A:#FF8A4C;--T:#FF6178;--R:#7E9CB4;--f1:#7FC3E0;--f2:#4AA1C2;--f3:#2A7A9C;--f4:#1B506B}
*{box-sizing:border-box}html{scroll-padding-top:150px}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 var(--fb);-webkit-text-size-adjust:100%}

main{max-width:1240px;margin:0 auto;padding:16px 18px 90px}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.pn-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}.pn-h h2,.pn-h h3{margin-right:auto}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g2>.pn{margin-top:14px}

@media(max-width:900px){.g2,.gi{grid-template-columns:1fr}.gi>div>.pn:first-child{margin-top:14px}.gi{display:flex;flex-direction:column}.gi>div{display:contents}.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}}

.N{--c:var(--N)}.W{--c:var(--W)}.A{--c:var(--A)}.T{--c:var(--T)}.R{--c:var(--R)}
.ch.W i,.sw.W,.seg-W{background:repeating-linear-gradient(135deg,var(--W) 0 4px,color-mix(in srgb,var(--W) 45%,var(--panel)) 4px 7px)}
.ch.T i{border-radius:50%}.ch.A i{clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}.ch.R i{border-radius:2px;background:transparent;border:2px solid var(--R)}

.axis{height:18px;position:relative;font-size:11.5px;color:var(--mute)}.axis span{position:absolute;top:0;transform:translateX(-1px);padding-left:4px;border-left:1px solid var(--line);height:18px}
.lane{position:relative;height:30px;margin-bottom:6px;background:var(--panel2);border-radius:4px;overflow:hidden}
.lane i{position:absolute;top:0;bottom:0;background:var(--c)}.lane i.W{background:repeating-linear-gradient(135deg,var(--W) 0 5px,color-mix(in srgb,var(--W) 45%,var(--panel)) 5px 9px)}
.lane i.R{background:color-mix(in srgb,var(--R) 55%,var(--panel2))}

.ph{position:absolute;top:14px;bottom:-4px;width:2px;background:var(--ink);pointer-events:none;margin-left:-1px}.ph:before{content:"";position:absolute;top:-2px;left:-5px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute);margin-top:6px}.legend .sw{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;background:var(--c)}
.legend .sw.R{background:color-mix(in srgb,var(--R) 55%,var(--panel2))}
/* tank */
.tk{display:grid;grid-template-columns:30px minmax(0,1fr) 150px 92px;gap:6px 14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;margin-top:8px;cursor:pointer;background:var(--panel)}

.tk .why .sbar{display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--line)}.tk .why .sbar i{display:block}.tk .why small{display:block;margin-top:3px;color:var(--mute);font-size:12px}
.tk .sc{font:600 34px/1 var(--fd);text-align:right;font-variant-numeric:tabular-nums}.tk .sc small{display:block;font:400 12px var(--fb);color:var(--mute);margin-top:2px}
.tk .st{grid-column:auto}

.f1{background:var(--f1)}.f2{background:var(--f2)}.f3{background:var(--f3)}.f4{background:var(--f4)}

details>summary{cursor:pointer;color:var(--brand);font-weight:500}

.bl{display:grid;grid-template-columns:44px 1fr 118px;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:3px 4px;border-radius:4px}
.bl:hover{background:var(--panel2)}.bl[aria-pressed=true]{background:color-mix(in srgb,var(--brand) 14%,transparent);box-shadow:inset 3px 0 0 var(--brand)}
.bl .b{height:13px;background:var(--f2);border-radius:2px}.bl.dim .b{background:var(--f4)}
.bl span.n{font-family:var(--fd);font-weight:600}.bl .v{font-size:13px;color:var(--mute);text-align:right;white-space:nowrap}
/* tables */
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:500;font-size:13px;white-space:nowrap}
td.r,th.r{text-align:right;white-space:nowrap}tr.click{cursor:pointer}tr.click:hover{background:var(--panel2)}
/* investigate */
.chips{display:flex;flex-wrap:wrap;gap:6px}.ac{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-left:5px solid var(--c);background:var(--panel);border-radius:6px;padding:5px 11px;text-align:left}
.ac[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink);border-left-color:var(--c)}.ac b{font-family:var(--fd)}.ac small{color:inherit;opacity:.75}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:14px}.hd h1{margin-right:4px}
.ban{margin-top:10px;padding:10px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--brand);font-size:16.5px}
.ban.w{border-left-color:var(--W)}.ban.a{border-left-color:var(--A)}.ban b{font-family:var(--fd);font-size:18px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.mg{grid-template-columns:1fr}}
.mc{border:1px solid var(--line);border-radius:6px;padding:6px 8px 4px;background:var(--panel)}.mc.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}.mc.off{opacity:.42}
.mh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13.5px}.mh .mn{font-weight:600;margin-right:auto}.mh .mv{font:600 17px var(--fd)}.mh .sg{font-size:12.5px;color:var(--mute)}
svg{display:block;width:100%;height:auto}svg text{font:11px var(--fb);fill:var(--mute)}svg .sv{fill:var(--ink)}
.cs{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.cs:first-of-type{border-top:0}
.cs .bar{height:8px;background:var(--line);border-radius:2px;overflow:hidden;grid-column:1}.cs .bar i{display:block;height:100%;background:var(--f2)}
.btn{white-space:nowrap;border:1px solid var(--brand);background:none;color:var(--brand);border-radius:6px;padding:4px 11px;font-weight:500}.btn:hover{background:var(--brand);color:#fff}.btn.pr{background:var(--brand);color:#fff}.btn:disabled{opacity:.45;cursor:default;background:none;color:var(--mute);border-color:var(--line)}
.btn.q{border-color:var(--line);color:var(--mute)}.btn.on{background:var(--brand);color:#fff}
.act{border-top:1px solid var(--line);padding:9px 0}.act:first-of-type{border-top:0}.ty{font-size:12.5px;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--panel2);border:1px solid var(--line)}
.ty.Corrective{border-color:var(--A);color:var(--A)}.ty.Preventive{border-color:var(--f2);color:var(--f2)}.ty.Roll-out{border-color:var(--R);color:var(--R)}
.gd summary{font-size:13px}.gd{font-size:13.5px;color:var(--mute);margin-top:5px;padding-left:10px;border-left:2px solid var(--line)}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.stat4 div{border-top:2px solid var(--line);padding-top:4px}.stat4 b{display:block;font:600 22px var(--fd)}.stat4 small{color:var(--mute)}
@media(max-width:560px){.stat4{grid-template-columns:repeat(2,1fr)}}
/* board */
.bd{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}@media(max-width:1000px){.bd{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.bd{grid-template-columns:1fr}}
.col{background:var(--panel2);border-radius:8px;padding:10px;min-height:120px}.col h3{display:flex;justify-content:space-between}.col.rc{background:color-mix(in srgb,var(--brand) 10%,var(--panel2));border:1px dashed var(--brand)}
.cd{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:8px;font-size:14px}.cd.od{border-color:var(--T);border-left:5px solid var(--T)}
.cd .m{font-size:12.5px;color:var(--mute);margin-top:3px}.cd .bx{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
/* foundation */
.flow{display:grid;grid-template-columns:1fr 34px 1fr 34px 1fr;align-items:stretch}@media(max-width:900px){.flow{grid-template-columns:1fr}.flow .arr{display:none}}
.flow .col2{display:flex;flex-direction:column;gap:8px}.nd{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel)}.nd b{font-family:var(--fd)}.nd.add{border-style:dashed}.nd small{display:block;color:var(--mute);line-height:1.35}
.nd.gv{background:color-mix(in srgb,var(--brand) 9%,var(--panel));border-color:var(--brand)}

.ba{display:grid;grid-template-columns:1fr 60px 1fr;gap:10px;align-items:center}@media(max-width:800px){.ba{grid-template-columns:1fr}.ba .arr{transform:rotate(90deg)}}

.im>div{border-top:3px solid var(--brand);padding-top:6px}
.sl{display:grid;grid-template-columns:1fr 60px;gap:2px 10px;align-items:center}.sl input{grid-column:1/3;width:100%;accent-color:var(--brand)}
/* misc */
#cap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:8px;max-width:min(680px,92vw);z-index:40;display:none;font-size:16px;line-height:1.4}
#cap b{font-family:var(--fd)}
dialog{max-width:640px;width:92vw;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px 20px}dialog::backdrop{background:rgba(5,12,18,.6)}dialog h2{margin-bottom:8px}dialog p{margin-top:8px;font-size:14.5px}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:6px;color:var(--mute);margin-top:8px}
@media(max-width:700px){.bar1,.bar2{padding:6px 12px;flex-wrap:wrap}.brand small{display:none}.clock{min-width:118px}.clock b{font-size:20px}#jump{display:none}main{padding:12px}#theme{display:none}#how{padding:5px 9px}h1{font-size:22px}.rib{--lab:64px}.rib-l small{display:none}.bar1{gap:6px}.bar1 .sp{display:none}#demo{margin-left:auto}nav{order:3;width:100%}}
@media(prefers-reduced-motion:no-preference){.ban{animation:in .35s}@keyframes in{from{opacity:.2}to{opacity:1}}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* v6 fixes: phone overflow */
.pn{overflow-x:auto;max-width:100%}
main{overflow-x:hidden}
@media(max-width:700px){
 .bar1{flex-wrap:wrap;gap:6px}
 #tabs{order:5;flex:1 0 100%;display:flex;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
 #tabs button{flex:0 0 auto}
 .hd-o{display:inline-block!important}
 table{display:block;max-width:100%;overflow-x:auto}
}

.loop{display:flex;margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.loop>span{flex:1;padding:8px 10px;text-align:center;border-left:1px solid var(--line);font:600 14px var(--fd);color:var(--mute);min-width:0}.loop>span:first-child{border-left:0}
.loop>span b{display:block;font:600 26px/1.1 var(--fd);color:var(--ink)}.loop>span small{display:block;font:400 12px var(--fb);color:var(--mute);line-height:1.25}
.loop>span.dn{background:color-mix(in srgb,var(--N) 16%,var(--panel));color:var(--ink)}.loop>span.cu{background:var(--ink);color:var(--panel)}
.sb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}@media(max-width:900px){.sb{grid-template-columns:1fr 1fr}}@media(max-width:560px){.sb{grid-template-columns:1fr}}
.sb>div{border-top:3px solid var(--brand);padding-top:6px;font-size:14px}.sb .lt{font:700 24px/1 var(--fd);color:var(--brand);margin-right:6px}.sb small.k{color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:11.5px}.sb p{margin-top:4px}.sb .bx{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tier{margin-top:12px;padding:8px 12px;border-radius:6px;background:var(--panel2);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.tier.late{border-left:5px solid var(--T);background:color-mix(in srgb,var(--T) 10%,var(--panel))}
.tg{font-size:12.5px;margin-top:2px;display:block}

 button,select,.bt{min-height:40px}

${D.map(d=>{const lc=s=>/^[A-Z]{2,}/.test(s)?s:s.toLowerCase(),o=d.opts||['Use '+lc(d.a[0]),'Use '+lc(d.b[0])],r=S.res[d.id];return`<div class="dq ${r?'ok':d.sev=='Low'?'lo':''}"><b>${d.t}</b> <span class="tag">${d.sev}</span><div class="ab"><div><small class="mu">${d.a[0]}</small><br>${d.a[1]}</div><div><small class="mu">${d.b[0]}</small><br>${d.b[1]}</div></div><p class="sm mu">${d.why}</p><div style="margin-top:6px">${r?`<span class="ch N"><i></i>Golden record: ${r}</span> <button class="btn q" data-res="${d.id}|">Undo</button>`:`<button class="btn" data-res="${d.id}|${o[0]}">${o[0].replace(/^./,c=>c.toUpperCase())}</button> <button class="btn" data-res="${d.id}|${o[1]}">${o[1].replace(/^./,c=>c.toUpperCase())}</button>`}</div></div>`}).join('')}</section>`}
/* ================= IMPACT ================= */
const ADDR=['leak','vib','heat','foul','worn','loose','crack'],SPAN=(D0('2026-07-25')-D0('2024-01-04'))/DAY/365.25;
function impRes(){const pool=INC.filter(i=>ADDR.includes(i.mf)),pl=sum(pool.map(i=>i.loss)),pd=sum(pool.map(i=>i.dt)),c=S.I.cap/100,r=S.I.red/100;
 return`<div class="im"><div><div class="big">${fmtK(pl/SPAN*c*r)}</div><div class="sm">Illustrative annual loss avoidance</div><p class="note">${fmtK(pl/SPAN)} addressable per year × ${S.I.cap}% caught early × ${S.I.red}% of loss avoided</p></div>
<div><div class="big">${Math.round(pd/SPAN*c*r)} h</div><div class="sm">Unplanned downtime avoided per year</div><p class="note">${Math.round(pd/SPAN)} h addressable per year, same two shares</p></div>
<div><div class="big">${Math.round(INC.length/SPAN*S.I.hrs).toLocaleString('en-US')} h</div><div class="sm">Data-validation time saved per year</div><p class="note">${Math.round(INC.length/SPAN)} incidents per year × ${S.I.hrs} h across functions</p></div></div>`}

function scorecard(){const cut=D0('2026-07-25'),all=ASSETS.flatMap(a=>a.c.acts),cl=all.filter(x=>x.stt=='Closed').length,od=all.filter(x=>x.stt!='Closed'&&D0(x.due)<cut).length,noAR=INC.filter(i=>OPEN.includes(i.status)&&!i.ar).length;
 const R=[['Actions recorded as closed (not verified by KPI)',cl+' of '+all.length+' in the register','80% or more, on time'],['Open and past due at the data cut-off (25 Jul 2026)',od+' actions','0'],['Open incidents with no AR number',noAR+' incidents','0'],['Lead time ahead of the DCS alarm',avg(ASSETS.map(a=>a.lead)).toFixed(1)+' wk average across 5 cases','2 wk or more'],['Time from first flag to a named decision','Not measurable: no timestamped acknowledgement exists today','1 day or less for Tier 1']];
 return`<section class="pn"><div class="pn-h"><h2>Closed-loop scorecard</h2><span class="sm mu">Does the loop actually close? Baseline is measured, targets are proposed</span></div><div class="tb"><table><tr><th>Loop KPI</th><th>Baseline from the data</th><th>Target with OpsLens</th></tr>${R.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td></tr>`).join('')}</table></div></section>`}
function vImp(){const tl=sum(INC.map(i=>i.loss)),td=sum(INC.map(i=>i.dt)),pool=INC.filter(i=>ADDR.includes(i.mf)),pl=sum(pool.map(i=>i.loss)),g=groupBy(INC,i=>i.mf),mx=g[0].loss;
 return`<h1>Business impact</h1><p class="lead">What the early warning was worth in the five RCA cases, and what it could be worth across the whole Incident DB. Assumptions are adjustable.</p>
<section class="pn hero"><div class="pn-h"><h2>Measured in this replay</h2><span class="sm mu">Five failures, real dates and losses</span></div>
<div class="tb"><table><tr><th>Asset</th><th>OpsLens flag</th><th>DCS alarm</th><th>Trip</th><th class="r">Ahead of DCS</th><th class="r">Ahead of trip</th><th class="r">Downtime</th><th class="r">Loss</th></tr>${ASSETS.map(a=>`<tr class="click" tabindex="0" data-open="${a.tag}"><td><b>${a.tag}</b></td><td>${dS(a.t[a.fl],true)}</td><td>${dS(a.t[a.al],true)}</td><td>${dS(a.failMs,true)}</td><td class="r num">${a.lead>0?a.lead+' wk':a.lead<0?'DCS first by '+(-a.lead)+' wk':'same week'}</td><td class="r num">${a.leadFail} wk</td><td class="r num">${a.r.dt} h</td><td class="r num">${fmtK(a.r.loss)}</td></tr>`).join('')}
<tr><td><b>Total</b></td><td colspan="3"></td><td class="r num"><b>${avg(ASSETS.map(a=>a.lead)).toFixed(1)} wk avg</b></td><td class="r num"><b>${avg(ASSETS.map(a=>a.leadFail)).toFixed(1)} wk avg</b></td><td class="r num"><b>${sum(ASSETS.map(a=>a.r.dt))} h</b></td><td class="r num"><b>${fmtK(sum(ASSETS.map(a=>a.r.loss)))}</b></td></tr></table></div>
<p class="note">The flag rule raised no flag in ${HEALTHY.n} healthy weeks (${HEALTHY.fp} false flags). On BL-5702 the DCS alarmed first, so the value there is the named cause and the action, not lead time. Lead time only pays off if someone acts on it, which is why the tracker matters.</p></section>
${scorecard()}
 <section class="pn"><div class="pn-h"><h2>Scenario for the whole plant estate</h2><span class="tag">scenario · not realized savings</span></div>
<div class="wk"><label>Share of addressable failures caught early: <b class="num" id="v-cap">${S.I.cap}%</b><input type="range" min="0" max="100" value="${S.I.cap}" data-im="cap" aria-label="Share caught early"></label><label>Share of loss avoided when caught early: <b class="num" id="v-red">${S.I.red}%</b><input type="range" min="0" max="100" value="${S.I.red}" data-im="red" aria-label="Share of loss avoided"></label><label>Validation hours saved per incident: <b class="num" id="v-hrs">${S.I.hrs} h</b><input type="range" min="0" max="20" value="${S.I.hrs}" data-im="hrs" aria-label="Hours saved per incident"></label></div>
<div id="imres">${impRes()}</div>
<p class="note">Base numbers are real: ${INC.length} incidents, ${Math.round(td).toLocaleString('en-US')} h and ${fmtK(tl)} from Jan 2024 to Jul 2026 (${SPAN.toFixed(1)} years). Addressable means failure modes that show up in condition data first: leakage, vibration, overheating, fouling, wear, loosening and cracking. That is ${Math.round(pl/tl*100)}% of the loss.</p></section>
<div class="g2"><section class="pn"><div class="pn-h"><h3>Loss by failure mechanism</h3></div>${g.map(x=>`<div class="bl ${ADDR.includes(x.k)?'':'dim'}" style="grid-template-columns:120px 1fr 100px"><span class="n" style="font-weight:500">${MFN[x.k]}</span><span class="b" style="width:${x.loss/mx*100}%"></span><span class="v num">${fmtK(x.loss)}</span></div>`).join('')}<p class="note">Dark bars are addressable by early warning.</p></section>
<section class="pn"><div class="pn-h"><h3>Beyond loss</h3></div><p class="sm"><b>Faster decisions.</b> Teams stop reconciling reports first. The data-quality panel already surfaces ${dq().length} conflicts a team would otherwise find in a meeting.</p><p class="sm" style="margin-top:8px"><b>Safer follow-through.</b> ${INC.filter(i=>OPEN.includes(i.status)).length} incidents are open, ${INC.filter(i=>OPEN.includes(i.status)&&!i.ar).length} of them without an AR number. One board with owners and verified closure removes that blind spot.</p><p class="sm" style="margin-top:8px"><b>Knowledge kept.</b> Every RCA becomes searchable, so a new engineer sees what the last one learned.</p></section></div>`}
/* ================= render + events ================= */
const VIEW={cmd:vCmd,inv:vInv,act:vAct,fnd:vFnd,imp:vImp};
function render(){calc();head();$('#app').innerHTML=VIEW[S.tab]()}
function go(t,scroll=true){S.tab=t;render();if(scroll)scrollTo(0,0)}
function verifyMsg(a){const s=at(a,S.ms);return`Not yet. ${a.sig[0].n} is ${s.i>=0?fmtSig(a,0,Math.min(s.i,25)):'not monitored'}, still off its baseline of ${nf(a.base[0].m)} ${a.sig[0].u}. Move the timeline to ${dS(a.t[21],true)} or later to verify.`}
document.addEventListener('click',e=>{const d=e.target.closest('[data-tab],[data-open],[data-lens],[data-filt],[data-clr],[data-mode],[data-ev],[data-inc],[data-mk],[data-mv],[data-dis],[data-res],[data-af],[data-reset],[data-ack],[data-fb]');if(!d)return;const q=d.dataset;
 if(q.tab)go(q.tab);else if(q.open){S.sel=q.open;S.ev=null;S.evI=null;S.inc=null;go('inv')}
 else if(q.lens){S.lens=q.lens;render()}else if(q.filt){S.f[q.filt]=S.f[q.filt]==q.v?null:q.v;render()}else if(q.clr){S.f={};render()}else if(q.mode){S.mode=q.mode;render()}
 else if(q.ev!==undefined){if(q.ev=='x'||S.evI===+q.ev){S.ev=null;S.evI=null}else{const a=byTag(S.sel),arr=a.c.phys[+q.ev].sig;S.ev=arr;S.evI=+q.ev}render()}
 else if(q.inc){S.inc=S.inc==+q.inc?null:+q.inc;render()}
 else if(q.mk){S.created[q.mk]={ms:S.ms,due:S.ms+OFF[byTag(q.mk.split('|')[0]).c.acts[+q.mk.split('|')[1]].ty]*DAY};delete S.dis[q.mk];render();cap('<b>Action created.</b> It is on the Actions board and counted as open.',3500)}
 else if(q.ack){S.ack[q.ack]=S.ms;render();cap('<b>Alert acknowledged.</b> The escalation clock stops.',3000)}
  else if(q.fb){const [t,v]=q.fb.split('|');S.fb[t]=v;render();cap('<b>Saved to the knowledge base.</b> Your '+(v=='y'?'confirmation raises':'rejection lowers')+' the weight of this cause for similar alerts.',4000)}
  else if(q.dis){S.dis[q.dis]=1;render()}
 else if(q.mv){const [t,n]=q.mv.split('|'),a=byTag(t),it=items().find(i=>i.key==q.mv);if(!it)return;
  if(it.col==2){if(at(a,S.ms).i<21){cap(verifyMsg(a),6000);return}S.mv[q.mv]=3;cap(`<b>Verified.</b> ${a.sig[0].n} is back at ${fmtSig(a,0,Math.min(at(a,S.ms).i,25))}. Action closed.`,4500)}else S.mv[q.mv]=it.col+1;render()}
 else if(q.res){const [id,v]=q.res.split('|');if(v)S.res[id]=v;else delete S.res[id];render()}
 else if(q.af){S.af=q.af;render()}else if(q.reset){S.created={};S.ack={};S.fb={};S.mv={};S.dis={};render()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.matches('[role=button][tabindex],tr[tabindex]'))e.target.click()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.w){S.W[t.dataset.w]=+t.value;$('#tankrows').innerHTML=tankRows();document.querySelectorAll('.wv').forEach(x=>x.textContent=S.W[x.dataset.k])}
 else if(t.dataset.im){S.I[t.dataset.im]=+t.value;$('#v-'+t.dataset.im).textContent=t.value+(t.dataset.im=='cap'||t.dataset.im=='red'?'%':' h');$('#imres').innerHTML=impRes()}});
document.addEventListener('toggle',e=>{if(e.target.id=='wdet')S.wOpen=e.target.open},true);
$('#day').addEventListener('input',e=>{S.ms=T0+(+e.target.value)*DAY;sched()});
$('#jump').addEventListener('change',e=>{if(e.target.value)setDate(+e.target.value);e.target.value=''});
const ribSet=e=>{const t=$('#ribt');if(!t)return;const r=t.getBoundingClientRect();setDate(T0+Math.round(clamp((e.clientX-r.left)/r.width,0,1)*NDAYS)*DAY,true)};
document.addEventListener('pointerdown',e=>{if(e.target.closest('#ribt')){S.drag=true;ribSet(e)}});
addEventListener('pointermove',e=>{if(S.drag)ribSet(e)});addEventListener('pointerup',()=>S.drag=false);addEventListener('pointercancel',()=>S.drag=false);
$('#play').onclick=()=>{if(S.play){clearInterval(S.play);S.play=null;$('#play').textContent='Play';return}if(S.ms>=T1-DAY)S.ms=T0;$('#play').textContent='Pause';S.play=setInterval(()=>{S.ms+=DAY;if(S.ms>=T1){S.ms=T1;clearInterval(S.play);S.play=null;$('#play').textContent='Play'}render()},110)};
$('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
$('#how').onclick=()=>{$('#dlg').innerHTML=`<h2>How this works</h2>
<p><b>Early warning.</b> For each signal we take the mean and spread of its first 5 weeks. A signal counts when it is more than 3σ from that baseline in the harmful direction. An asset is flagged when 3 of its 4 signals count in the same week. In ${HEALTHY.n} healthy weeks the rule raised ${HEALTHY.fp} flags.</p>
<p><b>Priority index, 0 to 100.</b> A configurable heuristic, not a calibrated probability. A weighted mix of four things: criticality class, how many signals agree, time to trip (straight-line trend of each signal to its trip limit) and cost if it fails. Change the weights in the Problem tank and the queue re-ranks.</p>
<p><b>Cause and evidence.</b> Cause hypotheses and ruled-out checks come from the 4P and 4M+1E tables in the RCA reports. Evidence strength is how far the linked signals sit beyond baseline. In this replay the RCA written after each failure is the knowledge base. In live use it would be earlier, similar RCAs.</p>
<p><b>Similar incidents.</b> All 380 incidents are scored on equipment type (40), component (35) and failure mechanism (25), using only incidents before the replay date.</p>
<p><b>Loss at stake.</b> Loss per hour from the RCA times the average outage of similar failures in the Incident DB.</p>
<p><b>Closing an action.</b> It closes only after the main signal is back at baseline, so move the timeline past the repair date.</p>
<p><b>Decision loop.</b> Every alert moves through Detect, Explain, Decide, Act and Verify. A person confirms or rejects the cause, acknowledges the alert within a severity-based time (Tier 1 to 3, otherwise it escalates), accepts the action, and the loop only closes when the signal recovers. Feedback is written back to the knowledge base.</p>
<p><b>Simulated.</b> Energy (modelled from HE-3301 heat duty), the count of seven legacy reports, and the scenario assumptions on the Impact page. Everything else comes from the four datasets.</p><button class="btn pr" onclick="this.closest('dialog').close()" style="margin-top:12px">Close</button>`;$('#dlg').showModal()};
/* ================= guided demo ================= */
function stopDemo(msg){(S.demo||[]).forEach(clearTimeout);clearInterval(S.demoI);S.demo=null;$('#demo').textContent='Guided demo';if(msg)cap('Demo stopped.',1500);else capOff()}
$('#demo').onclick=()=>{if(S.demo){stopDemo(true);return}
 if(S.play){clearInterval(S.play);S.play=null;$('#play').textContent='Play'}
 const T=[],at_=(ms,f)=>T.push(setTimeout(f,ms));S.demo=T;$('#demo').textContent='Stop demo';S.created={};S.ack={};S.fb={};S.mv={};S.dis={};S.sel='KO-3201';S.lens='Operations';S.f={};
 const KO=byTag('KO-3201');
 S.tab='cmd';S.ms=D0('2026-01-07');S.ev=null;S.evI=null;render();scrollTo(0,0);cap('<b>7 Jan 2026.</b> Five critical assets, four data sources, one timeline. Every DCS reading is still normal.');
 at_(6000,()=>{cap('Now watch KO-3201, the cracked gas compressor.');S.demoI=setInterval(()=>{S.ms+=DAY;render();if(S.ms>=KO.t[KO.fl]){clearInterval(S.demoI)}},240)});
 at_(10800,()=>{cap('<b>21 Jan.</b> OpsLens flags KO-3201: '+(KO.ns[KO.fl]==4?'all four':KO.ns[KO.fl]+' of its four')+' signals are beyond 3σ together. The DCS has not alarmed.')});
 at_(16500,()=>{S.tab='inv';render();scrollTo(0,0);cap('Why? Lube-oil water and vibration are rising together. That points to water getting into the lube oil.')});
 at_(21500,()=>{S.ev=KO.c.phys[0].sig;S.evI=0;render();cap('The evidence is highlighted on the trends. Every number comes from the source files.')});
 at_(27500,()=>{$('#p-act').scrollIntoView({behavior:'smooth',block:'center'});cap('The fix arrives with an owner, guidance and its own risk, taken from past RCAs. A person decides.')});
 at_(32500,()=>{S.fb['KO-3201']='y';S.ack['KO-3201']=S.ms;S.created['KO-3201|0']={ms:S.ms,due:S.ms+7*DAY};render();$('#p-act').scrollIntoView({block:'center'});cap('<b>Cause confirmed, alert acknowledged, action created</b> for STA-02. The loop moves from Detect to Act.')});
 at_(38000,()=>{S.ms=D0('2026-02-11');render();scrollTo(0,0);cap('<b>11 Feb.</b> The DCS finally alarms. That is 3 weeks after OpsLens flagged it.')});
 at_(43500,()=>{S.ms=D0('2026-04-29');render();scrollTo(0,0);cap('<b>29 Apr.</b> KO-3201 trips: 32 h down and US$1.58M lost. The RCA written after this failure confirms the cause OpsLens hypothesised on 21 Jan. In this replay that RCA is the knowledge base.')});
 at_(50000,()=>{S.tab='act';render();scrollTo(0,0);cap('The action stays on the board until the signal is verified back at baseline.')});
 at_(56000,()=>{cap('Now try it: drag the timeline, open an asset, create an action.',5000);stopDemo();$('#cap').style.display='block';setTimeout(capOff,5000)})};
render();

</script><script>(()=>{let t;const fix=()=>{document.querySelectorAll('main *,header *').forEach(e=>{if(e.closest('svg')||![...e.childNodes].some(n=>n.nodeType==3&&n.textContent.trim()))return;if(parseFloat(getComputedStyle(e).fontSize)<12)e.style.fontSize='12px'})};new MutationObserver(()=>{clearTimeout(t);t=setTimeout(fix,60)}).observe(document.body,{childList:true,subtree:true});fix()})()</script>
